plugins {
    // 仅保留 Android 应用插件：示例不使用 Compose，也不需要 Material Components
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.FreshingAir.ADExample'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.FreshingAir.ADExample"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 与 library 保持一致：广告 SDK 只提供 arm64-v8a / armeabi-v7a 的 so
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }

    compileOptions {
        // library 以 Java 17 编译，使用方的 source/target 不能低于它，否则读取其 class 会报
        // "class file has wrong version 61.0"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // 使用 ViewBinding 替代 findViewById（AGP 内置能力，与 Material 无关）
        viewBinding true
    }
}

dependencies {
    // 广告聚合 SDK：入口 AdPlatform / loadAdByType / LocalAdBridge 均由它提供
    implementation project(':library')

    // 仅使用 androidx 基础组件
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
